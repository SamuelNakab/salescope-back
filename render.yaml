services:
  - type: web
    name: salescope-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn salescope.wsgi"
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: SESSION_SECRET
        sync: false
